name: Build Android APK

on:
  push:
    branches: [ "main", "android" ]
  pull_request:
    branches: [ "main", "android" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew

    - name: Build Debug APK
      run: |
        cd android
        ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Run Unit Tests
      run: |
        cd android
        ./gradlew test --no-daemon --stacktrace

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: nba-predictor-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk

    - name: Create Release with APK
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/android'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0
        name: NBA Predictor v1.0.0 (Native Android)
        body: |
          🏀 **NBA Predictor Native Android APK**
          - %100 Saf Kotlin + Jetpack Compose
          - Birebir Savunmacı (Primary Defender) Matrisi
          - Sirkadiyen Ritim, Jetlag & Rakım Yorgunluk Motoru
          - Playoff & Taktiksel Savunma Şemaları (Drop/Switch/Blitz)
          - Devre Arası Canlı Projeksiyon Güncellemesi
          - Poisson & Normal Gauss CDF Barem Hesaplayıcı
        files: android/app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: true
